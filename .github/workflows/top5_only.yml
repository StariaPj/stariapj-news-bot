name: TOP 5 Only - No Email

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news-publication
  cancel-in-progress: false

jobs:
  top5-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TOP 5 dependencies
        run: python -m pip install feedparser requests
      - name: Generate TOP 5 only
        run: python generate_top5.py
      - name: Verify five items and region metadata
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          data = json.loads(Path('public/top5.json').read_text(encoding='utf-8'))
          items = data['top5']
          counts = Counter(x.get('region') for x in items)
          print('TOP 5 counts:', dict(counts))
          for i, x in enumerate(items, 1):
              print(f"{i}. [{x.get('region')}] {x.get('title_ko')}")
          assert len(items) == 5, f'Expected 5 news items, got {len(items)}'
          assert all(x.get('region') in ('ZA', 'KR', 'INT') for x in items)
          assert len({x['source_url'] for x in items}) == 5
          PY
      - name: Publish TOP 5 JSON only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/top5.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh TOP 5 only (no email)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
