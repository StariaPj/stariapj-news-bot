name: StariaPj Daily News Automation

on:
  schedule:
    - cron: '5 5 * * *'   # 남아공 07:05 / 한국 14:05 (UTC 05:05)
    - cron: '5 13 * * *'  # [추가] 남아공 15:05 / 한국 22:05 (UTC 13:05)
    - cron: '5 21 * * *'  # 한국 06:05 / 남아공 23:05 (UTC 21:05)
  workflow_dispatch: # 언제든 수동 실행 가능

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run News Analysis & Drive Upload
      env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: |
        python main.py
