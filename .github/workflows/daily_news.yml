name: StariaPj Daily News Automation

on:
  schedule:
    # ⏰ 1차: 남아공(케이프타운) 아침 07:05 (UTC 05:05 / 한국 14:05)
    - cron: '5 5 * * *'
    # ⏰ 2차: 남아공(케이프타운) 저녁 07:05 (UTC 17:05 / 한국 02:05)
    - cron: '5 17 * * *'
  workflow_dispatch: # 언제든 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: daily-news-publication
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run News Analysis & Drive Upload
      env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      run: |
        python main.py

    - name: Expire old PDF newsletters
      if: always()
      run: python publish_news.py

    - name: Publish tourism feed
      if: always()
      run: |
        git config user.name "stariapj-news-bot"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A public/
        if ! git diff --cached --quiet; then
          git commit -m "Refresh public tourism headlines"
          git push
        fi
